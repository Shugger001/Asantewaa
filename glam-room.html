<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="The Glam Room by Asantewaa — Accra's premier salon. Adenta & Sowutuom locations.">
  <meta name="theme-color" content="#000000">
  <title>The Glam Room | Asantewaa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <link rel="stylesheet" href="styles.css?v=20260534">
  <link rel="stylesheet" href="home.css?v=20260534">
  <link rel="stylesheet" href="glam-room.css?v=20260534">
  <link rel="stylesheet" href="mobile.css?v=20260534">
</head>
<body data-page="glam-room" class="gr-page">

  <header class="gr-topbar">
    <a href="glam-room.html" class="gr-topbar-link" id="home-topbar-left">GLAM ROOM</a>
    <span class="gr-topbar-sep" aria-hidden="true">*</span>
    <button class="gr-topbar-menu" id="home-menu-open" aria-label="Open menu">MENU</button>
  </header>

  <div class="home-menu-overlay" id="home-menu-overlay"></div>
  <nav class="home-menu-panel" id="home-menu-panel" aria-label="Site navigation">
    <button class="home-menu-close" id="home-menu-close">Close</button>
    <ul class="home-menu-links" id="home-menu-links"></ul>
    <div class="home-menu-socials" id="home-menu-socials"></div>
    <p class="home-menu-footer" id="home-menu-footer"></p>
  </nav>

  <main class="gr-main">
    <!-- PAGE 03 · SECTION 1 -->
    <section class="gr-declaration" id="glam-room">
      <h1 class="gr-declaration__title" id="gr-declaration-title"></h1>
      <p class="gr-declaration__byline" id="gr-declaration-byline"></p>
      <p class="gr-declaration__tagline" id="gr-declaration-tagline"></p>
    </section>

    <!-- PAGE 03 · SECTION 2 -->
    <section class="gr-sanctuaries" id="gr-sanctuaries" aria-label="Salon locations"></section>

    <p class="gr-footer" id="gr-footer-mid"></p>

    <!-- PAGE 03b · SECTION 4 -->
    <section class="gr-services" id="services" aria-label="Signature services">
      <div id="gr-services-list"></div>
    </section>

    <p class="gr-footer" id="gr-footer-end"></p>
  </main>

  <!-- PAGE 03 · SECTION 3 — Booking overlay -->
  <div class="gr-overlay" id="gr-booking-overlay" aria-hidden="true">
    <div class="gr-overlay__panel" role="dialog" aria-modal="true" aria-labelledby="gr-overlay-title">
      <button type="button" class="gr-overlay__exit" id="gr-overlay-exit"></button>
      <h2 class="gr-overlay__title" id="gr-overlay-title"></h2>
      <p class="gr-overlay__location" id="gr-overlay-location"></p>
      <form id="gr-booking-form">
        <input type="hidden" id="gr-location-id" name="locationId">
        <div class="gr-field">
          <label for="gr-full-name">Your Name</label>
          <input type="text" id="gr-full-name" name="fullName" required autocomplete="name">
        </div>
        <div class="gr-field">
          <label for="gr-phone">Phone / WhatsApp Number</label>
          <input type="tel" id="gr-phone" name="phone" required autocomplete="tel">
        </div>
        <fieldset class="gr-field gr-field--services">
          <legend>Select Your Service</legend>
          <div class="gr-radio-group" id="gr-service-radios"></div>
        </fieldset>
        <div class="gr-field-row">
          <div class="gr-field">
            <label for="gr-date">Preferred Date</label>
            <input type="text" id="gr-date" name="date" placeholder="Pick a date" required>
          </div>
          <div class="gr-field">
            <label for="gr-time">Time</label>
            <select id="gr-time" name="time" required></select>
          </div>
        </div>
        <div class="gr-field">
          <label for="gr-notes">Special Notes or Requests</label>
          <textarea id="gr-notes" name="notes" rows="2"></textarea>
        </div>
        <button type="submit" class="gr-overlay__submit" id="gr-overlay-submit"></button>
        <p class="gr-overlay__msg" id="gr-overlay-msg" hidden></p>
      </form>
    </div>
  </div>

  <script type="module" src="app.js?v=20260536"></script>
</body>
</html>
