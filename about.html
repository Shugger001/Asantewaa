<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="The Enterprise — Asantewaa partnerships, verified audience analytics, campaign pillars and brand collaborations.">
  <meta name="theme-color" content="#000000">
  <title>The Enterprise | Asantewaa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="enterprise.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body data-page="enterprise" class="editorial-theme enterprise-page">

  <header class="home-topbar">
    <a href="glam-room.html" class="home-topbar-link" id="home-topbar-left">GLAM ROOM</a>
    <a href="index.html" class="home-topbar-center" aria-label="Home"><i class="fa-solid fa-star"></i></a>
    <button class="home-menu-btn" id="home-menu-open" aria-label="Open menu">MENU</button>
  </header>

  <div class="home-menu-overlay" id="home-menu-overlay"></div>
  <nav class="home-menu-panel" id="home-menu-panel" aria-label="Site navigation">
    <button class="home-menu-close" id="home-menu-close">Close</button>
    <ul class="home-menu-links" id="home-menu-links"></ul>
    <div class="home-menu-socials" id="home-menu-socials"></div>
    <p class="home-menu-footer" id="home-menu-footer"></p>
  </nav>

  <main class="editorial-main">
    <!-- PAGE 02 · SECTION 1 — Icon statement -->
    <section class="ent-statement" id="enterprise">
      <div class="ent-statement__portrait">
        <img id="enterprise-statement-image" src="" alt="" decoding="async">
      </div>
      <div class="ent-statement__copy">
        <div class="ent-display" id="enterprise-headlines" aria-label="Shaping culture. Driving engagement."></div>
        <div class="ent-bold-lines" id="enterprise-statements"></div>
        <div class="ent-body" id="enterprise-body"></div>
      </div>
    </section>

    <!-- PAGE 02 · SECTION 2 — Verified audience analytics -->
    <section class="ent-analytics" id="analytics" aria-label="Verified audience analytics">
      <div class="ent-metrics" id="enterprise-metrics"></div>
    </section>

    <!-- PAGE 02 · SECTION 3 — As seen with -->
    <section class="ent-brands" aria-label="As seen with">
      <div class="ent-brand-strip" id="enterprise-brands"></div>
      <p class="ent-footer-line" id="enterprise-footer-mid"></p>
    </section>

    <!-- PAGE 02b · SECTION 4 — Campaign pillars -->
    <section class="ent-pillars" aria-label="Strategic campaign offerings">
      <div class="ent-accordion" id="enterprise-pillars"></div>
      <p class="ent-footer-line" id="enterprise-footer-end"></p>
    </section>
  </main>

  <footer class="home-bottombar ent-site-footer">
    <span id="home-copyright"></span>
  </footer>

  <nav class="nav" id="nav" aria-hidden="true"><ul id="nav-links"></ul></nav>
  <footer class="footer" aria-hidden="true"><div id="footer-socials"></div><p id="footer-copyright"></p><p id="footer-tagline"></p></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
