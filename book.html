<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Book your appointment at Glam Room by Asantewaa, Accra's premier hair salon.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shugger001.github.io/Asantewaaa/book.html">
  <meta property="og:title" content="Book | Glam Room by Asantewaa">
  <meta property="og:description" content="Reserve your chair — choose your service, location, and time at Glam Room Accra.">
  <meta property="og:image" content="https://shugger001.github.io/Asantewaaa/images/asantewaa-gown-smile.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">
  <title>Book Your Glam | Glam Room by Asantewaa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <link rel="stylesheet" href="styles.css?v=20260571">
  <link rel="stylesheet" href="home.css?v=20260571">
  <link rel="stylesheet" href="booking.css?v=20260571">
  <link rel="stylesheet" href="premium.css?v=20260571">
  <link rel="stylesheet" href="mobile.css?v=20260571">
</head>
<body data-page="booking" class="editorial-theme booking-page">

  <div class="booking-bg" aria-hidden="true">
    <img src="images/asantewaa-gown-full-bw.png" alt="" decoding="async">
    <div class="booking-bg__shade"></div>
  </div>

  <header class="home-topbar">
    <a href="glam-room.html" class="home-topbar-link" id="home-topbar-left">GLAM ROOM</a>
    <a href="index.html" class="home-topbar-center" aria-label="Home">
      <img src="icons/logo-white.png" alt="" class="site-topbar-logo" width="32" height="32" decoding="async">
    </a>
    <button class="home-menu-btn" id="home-menu-open" aria-label="Open menu">MENU</button>
  </header>

  <div class="home-menu-overlay" id="home-menu-overlay"></div>
  <nav class="home-menu-panel" id="home-menu-panel" aria-label="Site navigation">
    <button class="home-menu-close" id="home-menu-close">Close</button>
    <ul class="home-menu-links" id="home-menu-links"></ul>
    <div class="home-menu-socials" id="home-menu-socials"></div>
    <p class="home-menu-footer" id="home-menu-footer"></p>
  </nav>

  <div class="booking-container editorial-main" id="booking">
    <div class="booking-grid">
      <aside class="personality-card">
        <ul class="booking-info-list" id="booking-locations-list"></ul>
      </aside>

      <div class="booking-form-card">
        <h1 class="booking-form-title">Book appointment</h1>
        <div id="successMessage" class="booking-alert success"><span id="successText"></span></div>
        <div id="errorMessage" class="booking-alert error"><span id="errorText"></span></div>
        <form id="bookingForm">
          <div class="form-group">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" required placeholder="e.g., Efua Mensah">
          </div>
          <div class="form-row-2 form-row-contact">
            <div class="form-group">
              <label for="phone">WhatsApp</label>
              <input type="tel" id="phone" required placeholder="+233 XX XXX XXXX">
              <p class="form-hint">We'll text you a reminder</p>
            </div>
            <div class="form-group">
              <label for="email">Email <span class="label-optional">optional</span></label>
              <input type="email" id="email" placeholder="Optional" autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <select id="location" required></select>
          </div>
          <div class="form-row-2 form-row-service">
            <div class="form-group">
              <label for="serviceCategory">Category</label>
              <select id="serviceCategory" required></select>
            </div>
            <div class="form-group">
              <label for="serviceStyle">Style</label>
              <select id="serviceStyle" required disabled></select>
            </div>
          </div>
          <p class="services-extension-notice services-extension-notice--booking" role="note"></p>
          <div class="form-row-2">
            <div class="form-group">
              <label for="date">Date</label>
              <input type="text" id="date" placeholder="Pick a date" required>
            </div>
            <div class="form-group">
              <label for="time">Time</label>
              <select id="time" required></select>
            </div>
          </div>
          <div class="form-group">
            <label for="notes">Notes <span class="label-optional">optional</span></label>
            <textarea rows="3" id="notes" placeholder="Anything we should know?"></textarea>
          </div>
          <div class="booking-summary" id="liveSummary">Your selection will appear here.</div>
          <button type="submit" class="btn-book-submit" id="submitBtn">Book appointment</button>
          <p class="booking-whatsapp-alt">Prefer WhatsApp? <a href="#" id="booking-wa-alt">Chat with Asantewaa directly</a></p>
        </form>
      </div>
    </div>

  </div>

  <footer class="home-bottombar">
    <span id="home-copyright"></span>
    <a href="index.html">Home</a>
  </footer>

  <script type="module" src="dist/app.bundle.js?v=60"></script>
</body>
</html>
